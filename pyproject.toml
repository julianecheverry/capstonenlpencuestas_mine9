[project]
name = "pln-encuestas"
version = "0.3.0"
description = "Pipeline de preguntas abiertas de encuestas: Etapa 1 preparación, Etapa 2 NLP, Etapa 3 limpieza y n-gramas"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "pandas (>=3.0.3,<4.0.0)",
    "nltk (>=3.9.4,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "wordcloud (>=1.9.6,<2.0.0)",
    "numpy (>=2.5.0,<3.0.0)",
    "scipy (>=1.18.0,<2.0.0)",
    "matplotlib (>=3.11.0,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "gensim (>=4.4.0,<5.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "black (>=24.0.0,<25.0.0)",
    "ruff (>=0.6.0,<1.0.0)",
    "mypy (>=1.11.0,<2.0.0)",
    "pylint (>=3.2.0,<4.0.0)"
]

# Heavy topic-modelling stack, kept optional so the base install stays light.
# Enable with:  poetry install --with topics
[tool.poetry.group.topics]
optional = true

[tool.poetry.group.topics.dependencies]
bertopic = ">=0.16.0,<1.0.0"
sentence-transformers = ">=3.0.0,<4.0.0"
umap-learn = ">=0.5.6,<1.0.0"
hdbscan = ">=0.8.38,<1.0.0"
plotly = ">=5.22.0,<6.0.0"

# Paquetes del flujo de tres etapas (src/). El código anterior está en
# historico_entregables/ y no se instala.
[tool.poetry]
packages = [
    { include = "preparacion", from = "src" },     # Etapa 1
    { include = "nlp_utilidades", from = "src" },  # Etapa 2 (utilidades; el modelo aún no está en el repo)
    { include = "limpieza", from = "src" },        # Etapa 3
]

[tool.pytest.ini_options]
# Solo las pruebas del flujo actual (tests/ en la raíz). historico_entregables/
# guarda código y pruebas retirados: pytest nunca entra ahí, ni siquiera con
# "pytest ." o desde el IDE.
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["historico_entregables", "notebooks", "data", "reportes", ".*", "__pycache__"]

[tool.coverage.run]
source = ["src"]
