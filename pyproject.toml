[project]
name = "pln-encuestas"
version = "0.3.0"
description = "NLP pipeline for open-ended university survey responses (cleaning, synonyms, EDA, feature engineering, topic modelling)"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "pandas (>=3.0.3,<4.0.0)",
    "nltk (>=3.9.4,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "wordcloud (>=1.9.6,<2.0.0)",
    "numpy (>=2.5.0,<3.0.0)",
    "scipy (>=1.18.0,<2.0.0)",
    "matplotlib (>=3.11.0,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "gensim (>=4.4.0,<5.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "black (>=24.0.0,<25.0.0)",
    "ruff (>=0.6.0,<1.0.0)",
    "mypy (>=1.11.0,<2.0.0)",
    "pylint (>=3.2.0,<4.0.0)"
]

# Heavy topic-modelling stack, kept optional so the base install stays light.
# Enable with:  poetry install --with topics
[tool.poetry.group.topics]
optional = true

[tool.poetry.group.topics.dependencies]
bertopic = ">=0.16.0,<1.0.0"
sentence-transformers = ">=3.0.0,<4.0.0"
umap-learn = ">=0.5.6,<1.0.0"
hdbscan = ">=0.8.38,<1.0.0"
plotly = ">=5.22.0,<6.0.0"

[tool.poetry]
packages = [
    { include = "limpieza.py", from = "src/datacleaning" },
    { include = "synonyms.py", from = "src/datacleaning" },
    { include = "settings.py", from = "src" }
]

[tool.pytest.ini_options]
pythonpath = ["src", "src/datacleaning"]
testpaths = ["tests"]

[tool.coverage.report]
# _download_model and load_model in synonyms.py are deliberately
# excluded from coverage: they call urllib.request.urlretrieve to
# download a ~1GB pretrained Word2Vec model from the internet, which
# is not viable to exercise in an automated test suite. Everything
# else in synonyms.py IS tested, using a mocked model. This exclusion
# is a test-suite configuration choice -- it does not modify
# synonyms.py itself.
exclude_also = [
    "def _download_model",
    "def load_model",
]
